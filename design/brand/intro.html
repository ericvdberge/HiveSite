<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Hivesite intro</title>
<!-- One self-contained file: no external scripts, styles, fonts or images. Fonts fall back to Georgia and the system sans. -->
<style>
:root{
  color-scheme:dark;
  --ink:#100E0B;--panel:#17140F;--champagne:#CDAE74;--bronze:#94733A;--ivory:#F5F1E8;--stone:#A69D8C;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --text:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:var(--ink);color:var(--ivory);font-family:var(--text);font-size:16px;line-height:1.6}
main{width:min(100%,720px);display:grid;gap:16px}
.eyebrow{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--champagne)}
h1{margin:0;font-family:var(--display);font-size:40px;font-weight:500;line-height:1.1}
.stage{background:var(--panel);border-radius:18px;padding:12px}
.stage svg{display:block;width:100%;height:auto}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
button{min-height:44px;padding:12px 20px;border:0;border-radius:999px;background:var(--champagne);color:var(--ink);font:600 15px/1 var(--text);cursor:pointer}
button:hover{text-decoration:underline;text-underline-offset:.2em}
button:focus-visible{outline:2px solid var(--ivory);outline-offset:3px}
.note{margin:0;color:var(--stone);font-size:14px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Hivesite · Intro · 2.7 s</p>
  <h1>The golden thread</h1>
  <div class="stage">
    <!-- The markup below is the final frame, so the page is complete without scripts and under reduced motion. -->
    <svg id="intro" viewBox="0 0 360 250" role="img" aria-labelledby="intro-title">
      <title id="intro-title">A point of light draws a gold hexagon with an H. It glides into the corner as the logo of a website that fades in around it.</title>
      <defs>
        <radialGradient id="intro-glow">
          <stop offset="0" stop-color="#F5F1E8"/>
          <stop offset="0.35" stop-color="#CDAE74" stop-opacity="0.8"/>
          <stop offset="1" stop-color="#CDAE74" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g class="site" opacity="1">
        <rect x="34" y="26" width="292" height="196" rx="10" fill="#100E0B" stroke="#94733A" stroke-opacity="0.5"/>
        <line x1="34" y1="54" x2="326" y2="54" stroke="#94733A" stroke-opacity="0.5"/>
        <text x="66" y="44" font-family="Cormorant Garamond, Georgia, serif" font-size="12" letter-spacing="3" fill="#F5F1E8">HIVESITE</text>
        <g class="blocks">
          <rect x="48" y="66" width="170" height="74" rx="4" fill="#CDAE74" fill-opacity="0.85"/>
          <rect x="226" y="66" width="88" height="74" rx="4" fill="#CDAE74" fill-opacity="0.3"/>
          <rect x="48" y="150" width="84" height="58" rx="4" fill="#CDAE74" fill-opacity="0.18"/>
          <rect x="138" y="150" width="84" height="58" rx="4" fill="#CDAE74" fill-opacity="0.18"/>
          <rect x="228" y="150" width="86" height="58" rx="4" fill="#CDAE74" fill-opacity="0.18"/>
        </g>
      </g>
      <path class="hex" d="M51 31 L58.79 35.5 L58.79 44.5 L51 49 L43.21 44.5 L43.21 35.5Z" fill="#CDAE74" fill-opacity="1" stroke="#CDAE74" stroke-width="1.4" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/>
      <text class="H" x="51" y="42.43" font-size="7.02" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-weight="600" fill="#100E0B" opacity="1">H</text>
      <circle class="light" r="8" fill="url(#intro-glow)" opacity="0"/>
    </svg>
  </div>
  <div class="controls">
    <button type="button" id="replay">Play again</button>
    <p class="note" id="reduced-note" hidden>Reduced motion is on, so the intro shows its final frame.</p>
  </div>
</main>

<script>
(() => {
  'use strict';

  // Every animated step of the intro, in milliseconds from the start.
  // check-brand.mjs reads this table: no `ms` may be under 300.
  const DURATIONS = {
    lightIn:  { start: 0,    ms: 300 }, // the light fades in as it sets off (plan.html: instant)
    trace:    { start: 0,    ms: 850 }, // the light traces the hexagon, sine ease
    fill:     { start: 700,  ms: 350 }, // gold fill
    letter:   { start: 800,  ms: 300 }, // the H appears
    lightOut: { start: 850,  ms: 300 }, // the light fades out (plan.html: 200 ms)
    glide:    { start: 1250, ms: 750 }, // the logo glides to the nav
    site:     { start: 1450, ms: 550 }, // the site fades in around it
    block:    { start: 1700, ms: 720 }  // each block settles; block i starts i * STAGGER_MS later
  };
  const STAGGER_MS = 70;  // a delay between starts, not a duration
  const TOTAL_MS = 2700;  // block.start + 4 * STAGGER_MS + block.ms

  const clamp = (x) => Math.max(0, Math.min(1, x));
  const lerp = (a, b, x) => a + (b - a) * x;
  // Slow in, slow out.
  const io = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const sine = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
  const at = (step, t, delay = 0) => (t - DURATIONS[step].start - delay) / DURATIONS[step].ms;
  const hexD = (cx, cy, r) => 'M' + [0, 1, 2, 3, 4, 5].map((k) => {
    const a = -Math.PI / 2 + k * Math.PI / 3;
    return (cx + r * Math.cos(a)).toFixed(2) + ' ' + (cy + r * Math.sin(a)).toFixed(2);
  }).join(' L') + 'Z';

  const svg = document.getElementById('intro');
  const q = (s) => svg.querySelector(s);
  const hex = q('.hex'), H = q('.H'), light = q('.light'), site = q('.site');
  const blocks = [...svg.querySelectorAll('.blocks rect')];
  const FROM = { x: 180, y: 122, r: 40 }, TO = { x: 51, y: 40, r: 9 };

  function frame(t) {
    const m = io(at('glide', t));
    const cx = lerp(FROM.x, TO.x, m), cy = lerp(FROM.y, TO.y, m), r = lerp(FROM.r, TO.r, m);
    const draw = sine(at('trace', t));
    hex.setAttribute('d', hexD(cx, cy, r));
    hex.setAttribute('stroke-dashoffset', 1 - draw);
    hex.setAttribute('fill-opacity', io(at('fill', t)));
    H.setAttribute('x', cx);
    H.setAttribute('y', cy + r * 0.27);
    H.setAttribute('font-size', r * 0.78);
    H.setAttribute('opacity', io(at('letter', t)));
    const glow = io(at('lightIn', t)) * (1 - io(at('lightOut', t)));
    if (glow > 0) {
      const p = hex.getPointAtLength(draw * hex.getTotalLength());
      light.setAttribute('cx', p.x);
      light.setAttribute('cy', p.y);
    }
    light.setAttribute('opacity', glow);
    site.setAttribute('opacity', io(at('site', t)));
    blocks.forEach((b, i) => {
      const s = io(at('block', t, i * STAGGER_MS));
      b.setAttribute('opacity', s);
      b.setAttribute('transform', `translate(0 ${(1 - s) * 6})`);
    });
  }

  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const note = document.getElementById('reduced-note');
  let raf = 0, t0 = 0;

  function stop() { cancelAnimationFrame(raf); raf = 0; }
  function showFinal() { stop(); frame(TOTAL_MS); }
  function tick(now) {
    const t = Math.max(0, now - t0);
    frame(Math.min(t, TOTAL_MS));
    raf = t < TOTAL_MS ? requestAnimationFrame(tick) : 0;
  }
  function play() {
    stop();
    if (reduce.matches) { showFinal(); return; }
    frame(0);
    t0 = performance.now();
    raf = requestAnimationFrame(tick);
  }

  function syncNote() { note.hidden = !reduce.matches; }
  // If reduced motion is switched on mid-play, jump to the final frame. Switching it off does not replay.
  reduce.addEventListener('change', () => { syncNote(); if (reduce.matches) showFinal(); });
  document.getElementById('replay').addEventListener('click', play);

  syncNote();
  play();

  // For reuse (story 12) and for inspection.
  window.HivesiteIntro = Object.freeze({ DURATIONS, STAGGER_MS, TOTAL_MS, play });
})();
</script>
</body>
</html>
