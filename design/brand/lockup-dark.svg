<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 176" width="380" height="176" role="img" aria-labelledby="hs-lockup-dark-title">
  <title id="hs-lockup-dark-title">Hivesite. Crafted by many. Made for you.</title>
  <!-- For dark backgrounds (Ink #100E0B or Panel #17140F). Transparent: place it on the background, it has none of its own. -->
  <g transform="translate(161 0)">
    <path d="M29 2 L55 17 L55 47 L29 62 L3 47 L3 17 Z" fill="none" stroke="#CDAE74" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M29 14 L44 22.5 L44 41.5 L29 50 L14 41.5 L14 22.5 Z" fill="none" stroke="#CDAE74" stroke-width="1" stroke-linejoin="round" opacity="0.6"/>
    <text x="29" y="38" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="17" font-weight="600" fill="#CDAE74">H</text>
  </g>
  <!-- letter-spacing adds space after the last letter too, so the wordmark is shifted right by half of it to stay centred -->
  <text x="196.4" y="112" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="40" font-weight="500" letter-spacing="12.8" fill="#F5F1E8">HIVESITE</text>
  <line x1="170" y1="131" x2="210" y2="131" stroke="#CDAE74" stroke-width="1"/>
  <text x="190" y="163" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-style="italic" fill="#A69D8C">Crafted by many. Made for you.</text>
</svg>
