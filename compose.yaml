# Local PostgreSQL for the Host in Development. Matches ConnectionStrings:Content in src/Hivesite.Host/appsettings.Development.json.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hivesite
      POSTGRES_USER: hivesite
      POSTGRES_PASSWORD: hivesite
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivesite -d hivesite"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
