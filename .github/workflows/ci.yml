name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Spec index is valid and up to date
        run: node scripts/spec-index.mjs specs --check

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sln
        run: echo "found=$(ls *.sln *.slnx 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - if: steps.sln.outputs.found != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - if: steps.sln.outputs.found != ''
        run: dotnet format --verify-no-changes
      - if: steps.sln.outputs.found != ''
        run: dotnet build -warnaserror
      - if: steps.sln.outputs.found != ''
        run: dotnet test --no-build
